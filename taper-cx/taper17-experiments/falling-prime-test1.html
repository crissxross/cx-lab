<style>
  body {min-height:100vh;background:repeating-conic-gradient(#000 0 25%,#222 0 50%) 0 / 50px 50px;}
  button {padding:.7em 1em;font-size:1rem;cursor:pointer;}
  #v {color:#fff;text-align:center;font-size:2rem;line-height:2;}
  #o1,#o2 {position:absolute;width:20px;height:20px;border-radius:50%;background:gold;}
</style>
<div id="v">
  <p id="i">Click to play</p>
  <div id="o1"></div>
  <div id="o2"></div>
</div>

<script>
  let go=0,s='';
  const a=new AudioContext(),
  w=window.innerWidth,
  h=window.innerHeight,
  b=document.createElement('button'),
  // p=document.createElement('p'),
  f=['sine','square','sawtooth','triangle'];
  o1.style.inset=`20vh ${w*0.33}px`;
  o2.style.inset=`20vh ${w*0.66}px`;
  b.innerText='Start';
  v.append(b);
  // p.style.cssText='position:absolute;color:gold;inset:20% 20%;';

  const play=(dtu=0, s='sine', t=3) => {
    const now=a.currentTime,
    osc=a.createOscillator(),
    g=a.createGain();
    osc.type=s;
    osc.frequency.value=440;
    osc.detune.value=dtu;
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now+t);
    osc.connect(g);
    g.connect(a.destination);
    osc.start(now);
    osc.stop(now+t+.05);
  }

  b.addEventListener('click', () => {
    s=f[Math.floor(Math.random()*f.length)];
    b.remove();
    go=1;
  });

  window.addEventListener('click', (e) => {
    if (!go) return;
    play();
    const detune = e.clientY/100;
    console.log('detune', detune)
    play(detune);
    if (detune < 1) {
      b.innerText = 'Restart';
      v.append(b);
    }
  });
</script>
