<html>
<head>
    <title>Perfect Prime Test 3</title>
</head>
<body>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        display: grid;
        place-content: center;
        gap: 2rem;
        min-height: 100vh;
        background: black;
        color: #fff;
      }
      #canv {
        border: 1px solid #222;
      }
      button {
        padding: .7em;
        background: #333;
        font-size: 1rem;
        color: #fff;
        cursor: pointer;
        &:hover {background: #444;}
    }
  </style>
  <p>Click to play sounds (test 3)</p>

  <script>
const audioCtx = new AudioContext();

// clamp(value, min, max) - if value is greater than max return max, but if value is smaller than min return min - i.e.
// function clamp (value, min, max) { return Math.max(min, Math.min(max, value))}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/**
 * Play a single note.
 * @param {number} frequency - Hz (default 440)
 * @param {number} detune - cents (default 0)
 * @param {string} type - oscillator type (default 'sine')
 * @param {number} gainAmount - linear gain (default 0.2)
 * @param {number} duration - seconds (default 1)
 */
function playNote(frequency = 440, detune = 0, type = 'sine', gainAmount = 0.2, duration = 3) {
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = frequency;
  osc.detune.value = detune; // in cents

  gain.gain.setValueAtTime(gainAmount, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + duration + 0.05);
}

function playSounds(e) {
  // ensure context is resumed on user gesture
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // 1) default note
  playNote();

  // 2) custom note with detune controlled by mouse Y (0..100 cents)
  const y = e.clientY;
  const detune = clamp((y / window.innerHeight) * 100, 0, 100);
  console.log(`Mouse Y: ${y}, Detune: ${detune}`);
  console.log(`Mouse X: ${e.clientX}, Mouse Y: ${y}, Detune: ${detune}`);
  // choose some custom params (frequency, detune, type, gain, duration)
  playNote(440, detune, 'sawtooth', 0.12, 1.4);
}

window.addEventListener('click', playSounds);
</script>

</body>
</html>
