In music, perfect prime is when two or more notes play (or sing) in unison at exactly the same pitch - and they must be identical notes, not, for example, two As an octave apart. When we hear two voices or analog instruments simultaneously sound the same tone, we can tell they come from separate sources because every voice or musical instrument has a unique timbre, which produces extra sound waves. Straightforward digital notes playing in perfect prime have precisely identical sound waves, making them sound like a single note.

On click, the Start (or Restart) button, randomly selects a basic waveform and base frequency and assigns them to two notes. On further clicks, one note will always remain perfectly consistent, while the other varies. You can only perceive there are two notes when they are out of tune. Digital prime may be more perfect but it's less intriguing. Once you've tuned into the prime spot (freq diff: 0), try exploring more interesting pitch pairings.

<style>body {min-height:100vh;background:repeating-conic-gradient(#000 0 12.5%,#222 0 25%) 0 / 50px 50px;}#v {color:#fff;text-align:center;font-size:2rem;line-height:2;}button {padding:.7em 1em;font-size:1rem;cursor:pointer;}</style>
<div id="v"><p id="i">Click to play notes & tune into perfect prime (0)</p></div>
<script>
  let z={x:0,y:0},go=0,s,n;
  const a=new AudioContext(),
  ran=Math.random,
  d=document,
  w=window.innerWidth,
  h=window.innerHeight,
  b=d.createElement('button'),
  o=d.createElement('div'),
  p=d.createElement('p'),
  ss=['sine','square','sawtooth','triangle'],
  ns=[261.63,293.66,329.63,349.23,392,440,493.88];
  b.innerText='Start';
  v.append(b);
  o.style.cssText='position:absolute;width:18px;height:18px;border-radius:50%;background:gold;';
  p.style.cssText='position:absolute;color:gold;inset:20% 20%;font-family:sans-serif';

  const play=(f,s) => {
    const now=a.currentTime,
    osc=a.createOscillator(),
    g=a.createGain();
    osc.type=s;
    osc.frequency.value=f;
    g.gain.setValueAtTime(0.2,now);
    g.gain.exponentialRampToValueAtTime(0.0001,now+5);
    osc.connect(g);
    g.connect(a.destination);
    osc.start(now);
    osc.stop(now+5.05);
  }

  b.addEventListener('click', () => {
    go=1;m=60;
    z={x: Math.round(m+ran()*(w-m*2)), y: Math.round(m+ran()*(h-m*2))};
    s=ss[Math.floor(ran()*ss.length)];
    n=ns[Math.floor(ran()*ns.length)];
    b.remove();
    o.remove();
  });

  window.addEventListener('click', (e) => {
    if (!go) return;
    play(n,s);
    const x=e.clientX, y=e.clientY,
    dx=(x-z.x)/(w/2), dy=(y-z.y)/(h/2),
    f=((Math.sqrt(dx*dx+dy*dy)/Math.SQRT2)*100).toFixed(2);
    i.innerText=`freq diff: ${f}`;
    play(n-f,s);
    if (f<1) {
      i.innerText=`freq diff: 0 👌 perfect prime!`;
      o.style.inset=`${z.y-9}px ${z.x-9}px`;
      d.body.appendChild(o);
      p.innerText='Tune_in_tune_out_play_on...'
      b.innerText='Restart';
      o.append(p);
      v.append(b);
      setTimeout(() => p.remove(), 5000);
    }
  });
</script>
